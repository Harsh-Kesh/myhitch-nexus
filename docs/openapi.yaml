components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: >-
        Nexus's own session token, issued after our backend verifies credentials against Auth0 server-side (Resource
        Owner Password Grant) or verifies a Google/Apple ID token directly against that provider's JWKS. This is
        deliberately **not** an Auth0-issued access/id token: per `docs/DEVELOPMENT-PLAN.md`'s Auth0 integration
        standard (DEC-6), Auth0 is called only for credential verification and MFA — no `auth0.com` URL, hosted-login
        redirect, or Auth0 token ever reaches the browser. The bearer token here is Nexus's own session, carried as an
        HttpOnly cookie or an Authorization header depending on client type.
  responses:
    BadRequest:
      description: The request was malformed or failed validation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: No valid session token was supplied.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: The authenticated user is not permitted to perform this action.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: The requested resource does not exist.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    ContentType:
      type: string
      description: The 11-type content taxonomy driving discovery, IA and category rules (SRS §5, FR-6.1.1).
      enum:
        - commercial
        - film
        - entertainment
        - education
        - news
        - documentary
        - live
        - tourism
        - government
        - nonprofit
        - user-generated
    ContentStatus:
      type: string
      description: >-
        Publication state machine for a content record (FR-6.3.6). AC-3 requires the transition into 'published' to be
        gated server-side.
      enum:
        - draft
        - pending
        - published
        - scheduled
        - private
        - unlisted
        - restricted
        - rejected
        - archived
    AccessModel:
      type: string
      description: Monetisation model(s) a video can be offered under (§6.7).
      enum:
        - free
        - ad-supported
        - rent
        - buy
        - subscription
        - ppv
        - membership
    AgeRating:
      type: string
      description: UK-style age classification.
      enum:
        - U
        - PG
        - '12'
        - '15'
        - '18'
    ChannelKind:
      type: string
      description: Determines badge and publishing capabilities for a channel (FR-6.1.6).
      enum:
        - creator
        - business
        - film-studio
        - education
        - government
        - nonprofit
        - news
    UserRole:
      type: string
      description: >-
        Additive account roles (SRS §4 / ROLE-1..11). A user's `roles` array may hold more than one; `activeRole`
        selects the current context.
      enum:
        - viewer
        - creator
        - business
        - advertiser
        - producer
        - education
        - organisation
        - admin
    LiveStatus:
      type: string
      enum:
        - upcoming
        - live
        - ended
        - replay
        - cancelled
    LiveAccessType:
      type: string
      description: Access mode for a live event (FR-6.5.3).
      enum:
        - public
        - private
        - ticketed
        - subscriber-only
        - invitation-only
    CampaignStatus:
      type: string
      enum:
        - draft
        - pending
        - active
        - paused
        - completed
        - rejected
    ModerationAction:
      type: string
      description: Single moderation-action vocabulary applied across content, comments, channels and campaigns (FR-6.10.2).
      enum:
        - approve
        - reject
        - request-changes
        - restrict
        - demonetise
        - geo-block
        - age-restrict
        - suspend
        - remove
    EntitlementReason:
      type: string
      enum:
