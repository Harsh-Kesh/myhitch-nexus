# MYHitch Nexus API — OpenAPI 3.1 specification
# SRS deliverable DEL-4 (solution architecture, data model, API specification).
# Generated from the mock-api service contract (src/lib/mock-api/index.ts, types.ts, hooks.ts).
# Do not hand-edit structural sections without regenerating — see docs/DEVELOPMENT-PLAN.md §2 and §9 item 7.

openapi: 3.1.0
info:
  title: MYHitch Nexus API
  version: 0.1.0-draft
  description: >-
    REST API specification for MYHitch Nexus (SRS deliverable DEL-4: solution architecture, data model and API
    specification).


    This specification is derived directly from the frontend prototype's mock service contract at
    `src/lib/mock-api/index.ts` — that file's own header states its ~96 typed async function signatures **are** the
    contract the real backend must implement (see `docs/DEVELOPMENT-PLAN.md` §2, "Strangle the mock API"). Every
    operation below traces to exactly one mock-api function, named in that operation's description as `Mock-API source`.


    Status: **draft, pre-implementation**. Nothing behind this contract exists yet — no backend, persistence, media
    pipeline or payment integration (see `docs/DEVELOPMENT-PLAN.md` §1). Endpoint shapes may still change as each domain
    is migrated phase by phase (P1–P4 per the development plan); this document is the current best specification, not a
    frozen contract.


    Cross-references: functional requirement IDs (FR-x.x.x), acceptance criteria (AC-x), security requirements (SEC-x)
    and data-model entities (DM-x) refer to `docs/SRS-TRACEABILITY.md`.
  contact:
    name: MYHitch Nexus Architecture
servers:
  - url: https://api.myhitchnexus.com.au/v1
    description: Production (target)
  - url: https://staging-api.myhitchnexus.com.au/v1
    description: Staging (target)
  - url: http://localhost:3000/api/v1
    description: Local development (Next.js route handlers)
security:
  - bearerAuth: []
tags:
  - name: Discovery & Catalogue
    description: Public homepage, search, catalogue browsing, channels and series (§6.1).
  - name: Identity & Profiles
    description: Registration, login, sessions, account/profile management, notifications (§6.2, §6.6.3).
  - name: Media & Upload
    description: Resumable upload, drafting, publishing, playlists (§6.3).
  - name: Playback & Entitlements
    description: Entitlement evaluation and watch-progress/resume (§6.4).
  - name: Live
    description: Live event scheduling, streaming, chat and polls (§6.5).
  - name: Social & Engagement
    description: Comments, ratings, likes, follows and watchlists (§6.6).
  - name: Commerce & Payments
    description: Purchases, rentals, subscriptions and the buyer-side commerce surface (§6.7).
  - name: Advertising
    description: Campaigns, creatives, leads and affiliate product links (§6.8).
  - name: Analytics
    description: Creator/business analytics and revenue reporting (§6.9).
  - name: Admin & Moderation
    description: Administration, moderation queue, audit log, case management, platform configuration (§6.10).
paths:
  /home/featured:
    get:
      operationId: getFeaturedContent
      summary: Get the personalised homepage rails
      description: >-
        Returns the hero carousel and content rails for the homepage (FR-6.1.1): continue watching, live/upcoming,
        films, followed channels, recommended, and per-vertical rails.


        _Mock-API source: `getFeaturedContent`._
      tags:
        - Discovery & Catalogue
      responses:
        '200':
          description: Homepage content.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeaturedContent'
      security: []
  /videos:
    get:
      operationId: searchVideos
      summary: Search and list published videos
      description: >-
        Advanced catalogue search with keyword, facet filters and pagination (FR-6.1.3, FR-6.1.4). Backed by a
        Typesense/Elasticsearch index in the real implementation for typo tolerance and facet counts.


        _Mock-API source: `searchVideos`._
      tags:
        - Discovery & Catalogue
      responses:
        '200':
          description: Paginated, faceted search results.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResult'
        '400':
          $ref: '#/components/responses/BadRequest'
      parameters:
        - name: query
          in: query
          required: false
          description: Free-text search across title, synopsis, tags, credits and channel name.
          schema:
            type: string
        - name: contentTypes
          in: query
          required: false
          description: Filter by content type(s).
          schema:
            type: array
            items:
              $ref: '#/components/schemas/ContentType'
        - name: categoryIds
          in: query
          required: false
          description: Filter by category id(s).
          schema:
            type: array
            items:
              type: string
        - name: languages
          in: query
          required: false
          description: Filter by language(s).
          schema:
            type: array
            items:
              type: string
        - name: countries
          in: query
          required: false
          description: Filter by country of origin.
          schema:
            type: array
            items:
              type: string
        - name: accessModels
          in: query
          required: false
          description: Filter by access model(s).
          schema:
            type: array
            items:
              $ref: '#/components/schemas/AccessModel'
        - name: ageRatings
          in: query
          required: false
          description: Filter by age rating(s).
          schema:
            type: array
            items:
              $ref: '#/components/schemas/AgeRating'
        - name: minDurationSeconds
          in: query
          required: false
          description: Minimum duration filter.
          schema:
            type: integer
        - name: maxDurationSeconds
          in: query
          required: false
          description: Maximum duration filter.
          schema:
            type: integer
        - name: releaseYearFrom
          in: query
          required: false
          description: Earliest release year.
          schema:
            type: integer
        - name: releaseYearTo
          in: query
          required: false
          description: Latest release year.
          schema:
            type: integer
        - name: hasSubtitles
          in: query
          required: false
          description: Only return videos with at least one subtitle track.
          schema:
            type: boolean
        - name: freeOnly
          in: query
          required: false
          description: Only return free or ad-supported videos.
          schema:
            type: boolean
        - name: sort
          in: query
          required: false
          description: Sort order.
          schema:
            type: string
            enum:
              - relevance
              - popular
              - newest
              - rating
              - duration
        - name: channelId
          in: query
          required: false
          description: Restrict results to one channel.
          schema:
            type: string
        - name: page
          in: query
          required: false
          description: 1-based page number.
          schema:
            type: integer
            default: 1
        - name: pageSize
          in: query
          required: false
          description: Results per page.
          schema:
            type: integer
            default: 24
      security: []
    post:
      operationId: publishDraft
      summary: Create a video from a completed draft
      description: >-
        Submits the upload wizard's draft — metadata, rights, pricing and status — to create the content record.
        **AC-3**: content that is sponsored, rated 18, or carries a content label is routed to the moderation queue
        instead of publishing directly, and this gate must hold even for a direct API call, not only the UI wizard.


        _Mock-API source: `publishDraft`._ Requires the 'creator', 'business' or 'producer' role.
      tags:
        - Media & Upload
      responses:
        '201':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Video'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VideoDraft'
  /videos/{id}:
    get:
      operationId: getVideo
      summary: Get a video by id or slug
      description: >-
        Returns the full video-detail record (FR-6.1.5): synopsis, credits, ratings, language, subtitles and related
        metadata.


        _Mock-API source: `getVideo`._
      tags:
        - Discovery & Catalogue
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Video'
        '404':
          $ref: '#/components/responses/NotFound'
      parameters:
        - name: id
          in: path
          required: true
          description: Video id or slug.
          schema:
            type: string
      security: []
    delete:
      operationId: deleteVideo
      summary: Delete a video
      description: |-
        Delete a video

        _Mock-API source: `deleteVideo`._ Requires ownership of the video's channel or an admin role.
      tags:
        - Media & Upload
      responses:
        '204':
          description: No content.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      parameters:
        - name: id
          in: path
          required: true
          description: Video id.
          schema:
            type: string
  /videos/{id}/related:
    get:
      operationId: getRelatedVideos
      summary: Get videos related to a given video
      description: >-
        Similarity-ranked related videos for the detail page's "related" rail (FR-6.1.5), scored by channel, content
        type, shared categories/tags and popularity.


        _Mock-API source: `getRelatedVideos`._
      tags:
        - Discovery & Catalogue
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Video'
        '400':
          $ref: '#/components/responses/BadRequest'
      parameters:
        - name: id
          in: path
          required: true
          description: Video id.
          schema:
            type: string
        - name: limit
          in: query
          required: false
          description: Maximum number of related videos to return.
          schema:
            type: integer
            default: 12
      security: []
  /categories:
    get:
      operationId: getCategories
      summary: List content categories
      description: |-
        Categories are platform configuration data (see /admin/config), not hardcoded — this proves that per FR-6.10.4.

        _Mock-API source: `getCategories`._
      tags:
        - Discovery & Catalogue
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Category'
      security: []
  /categories/{slug}:
    get:
      operationId: getCategory
      summary: Get a category by slug
      description: |-
        Get a category by slug

        _Mock-API source: `getCategory`._
      tags:
        - Discovery & Catalogue
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
        '404':
          $ref: '#/components/responses/NotFound'
      parameters:
        - name: slug
          in: path
          required: true
          description: Category slug.
          schema:
            type: string
      security: []
  /channels/{id}:
    get:
      operationId: getChannel
      summary: Get a channel by id or handle
      description: |-
        Channel page for creators, businesses, film studios, education, government and non-profit publishers (FR-6.1.6).

        _Mock-API source: `getChannel`._
      tags:
        - Discovery & Catalogue
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Channel'
        '404':
          $ref: '#/components/responses/NotFound'
      parameters:
        - name: id
          in: path
          required: true
          description: Channel id or handle.
          schema:
            type: string
      security: []
    patch:
      operationId: updateChannel
      summary: Update a channel's profile
      description: |-
        Update a channel's profile

        _Mock-API source: `updateChannel`._ Requires ownership of the channel (creator/business) or an admin role.
      tags:
        - Identity & Profiles
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Channel'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      parameters:
        - name: id
          in: path
          required: true
          description: Channel id or handle.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChannelUpdate'
  /channels:
    get:
      operationId: getChannels
      summary: List channels
      description: |-
        Backs the Creators directory (FR-6.1.2).

        _Mock-API source: `getChannels`._
      tags:
        - Discovery & Catalogue
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Channel'
      security: []
  /channels/{id}/videos:
    get:
      operationId: getChannelVideos
      summary: List a channel's videos
      description: |-
        List a channel's videos

        _Mock-API source: `getChannelVideos`._
      tags:
        - Discovery & Catalogue
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Video'
        '400':
          $ref: '#/components/responses/BadRequest'
      parameters:
        - name: id
          in: path
          required: true
          description: Channel id.
          schema:
            type: string
        - name: includeUnpublished
          in: query
          required: false
          description: >-
            Include draft/pending/scheduled videos. Requires ownership of the channel; ignored (treated as false)
            otherwise.
          schema:
            type: boolean
            default: false
      security: []
  /series:
    get:
      operationId: getSeries
      summary: List series
      description: |-
        Series/season/episode groupings (FR-6.3.7).

        _Mock-API source: `getSeries`._
      tags:
        - Discovery & Catalogue
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Series'
        '400':
          $ref: '#/components/responses/BadRequest'
      parameters:
        - name: channelId
          in: query
          required: false
          description: Restrict to one channel's series.
          schema:
            type: string
      security: []
  /auth/register:
    post:
      operationId: register
      summary: Register a new account
      description: >-
        Creates the account and role selection from the registration wizard (FR-6.2.2). Per DEC-6, this calls Auth0's
        Authentication API server-side (headless Resource Owner Password Grant) — no hosted-login redirect ever reaches
        the browser.


        _Mock-API source: `register`._
      tags:
        - Identity & Profiles
      responses:
        '201':
          description: Account created; email/mobile verification is now required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      security: []
  /auth/otp/verify:
    post:
      operationId: verifyOtp
      summary: Verify an email/mobile OTP code
      description: >-
        Confirms the one-time code sent by our own notification service (never Auth0's mailer, per the Auth0 integration
        standard) for FR-6.2.3 email/mobile verification.


        _Mock-API source: `verifyOtp`._
      tags:
        - Identity & Profiles
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OtpVerificationResult'
        '400':
          $ref: '#/components/responses/BadRequest'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyOtpRequest'
      security: []
  /auth/login:
    post:
      operationId: login
      summary: Sign in
      description: >-
        Verifies credentials against Auth0 server-side and issues Nexus's own session — the response is a Nexus session
        token, not an Auth0 token (DEC-6).


        _Mock-API source: `login`._
      tags:
        - Identity & Profiles
      responses:
        '200':
          description: >-
            Signed in; the session token is returned via an HttpOnly cookie or the Authorization header per the chosen
            session strategy.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      security: []
  /auth/logout:
    post:
      operationId: logout
      summary: Sign out
      description: |-
        Invalidates the current session.

        _Mock-API source: `logout`._
      tags:
        - Identity & Profiles
      responses:
        '204':
          description: No content.
        '401':
          $ref: '#/components/responses/Unauthorized'
  /me:
    get:
      operationId: getCurrentUser
      summary: Get the current account
      description: |-
        Get the current account

        _Mock-API source: `getCurrentUser`._
      tags:
        - Identity & Profiles
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
    patch:
      operationId: updateUser
      summary: Update the current account
      description: >-
        Profile management: name, country, language, notification preferences, parental controls, privacy settings
        (FR-6.2.4).


        _Mock-API source: `updateUser`._
      tags:
        - Identity & Profiles
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdate'
  /me/active-profile:
    post:
      operationId: switchProfile
      summary: Switch the active viewer profile
      description: |-
        Selects among the up-to-5 age-banded viewer profiles on the account (FR-6.2.6).

        _Mock-API source: `switchProfile`._
      tags:
        - Identity & Profiles
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SwitchProfileRequest'
  /me/active-role:
    post:
      operationId: setActiveRole
      summary: Switch the active role context
      description: >-
        An account may hold multiple additive roles (SRS §4); this selects which one is active for the current session's
        UI/permissions context.


        _Mock-API source: `setActiveRole`._
      tags:
        - Identity & Profiles
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetActiveRoleRequest'
  /me/request-country:
    get:
      operationId: getRequestCountry
      summary: Get the simulated request country
      description: >-
        Development/QA-only endpoint used to exercise geo-restriction logic (FR-6.4.6). In production the country is
        derived from the request (e.g. edge geo-IP), not read back from stored state.


        _Mock-API source: `getRequestCountry`._
      tags:
        - Identity & Profiles
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestCountryResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
    put:
      operationId: setRequestCountry
      summary: Set the simulated request country
      description: >-
        Development/QA-only endpoint — see GET /me/request-country. Not present in the production surface once real
        geo-IP resolution lands.


        _Mock-API source: `setRequestCountry`._
      tags:
        - Identity & Profiles
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestCountryResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetRequestCountryRequest'
  /me/notifications:
    get:
      operationId: getNotifications
      summary: List notifications
      description: |-
        New releases, live events, followed-channel activity, purchases and account activity (FR-6.6.3).

        _Mock-API source: `getNotifications`._
      tags:
        - Identity & Profiles
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AppNotification'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /me/notifications/{id}/read:
    post:
      operationId: markNotificationRead
      summary: Mark one notification read
      description: |-
        Mark one notification read

        _Mock-API source: `markNotificationRead`._
      tags:
        - Identity & Profiles
      responses:
        '204':
          description: No content.
        '401':
          $ref: '#/components/responses/Unauthorized'
      parameters:
        - name: id
          in: path
          required: true
          description: Notification id.
          schema:
            type: string
  /me/notifications/read-all:
    post:
      operationId: markAllNotificationsRead
      summary: Mark all notifications read
      description: |-
        Mark all notifications read

        _Mock-API source: `markAllNotificationsRead`._
      tags:
        - Identity & Profiles
      responses:
        '204':
          description: No content.
        '401':
          $ref: '#/components/responses/Unauthorized'
  /uploads:
    post:
      operationId: createUploadSession
      summary: Start a resumable upload session
      description: >-
        Begins a resumable direct-to-storage upload (FR-6.3.1). The real implementation issues a tus-protocol upload URL
        against the media provider (Mux/Cloudflare); this session tracks progress for the wizard.


        _Mock-API source: `createUploadSession`._
      tags:
        - Media & Upload
      responses:
        '201':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadSession'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUploadSessionRequest'
  /uploads/{id}/chunks:
    post:
      operationId: advanceUpload
      summary: Acknowledge the next uploaded chunk
      description: >-
        Advances the resumable transfer by one chunk, surfacing progress/failure state so the UI can pause, retry or
        resume without restarting (FR-6.3.1). Not part of the tus protocol surface itself — represents the provider's
        progress callback in the real system.


        _Mock-API source: `advanceUpload`._
      tags:
        - Media & Upload
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadSession'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
      parameters:
        - name: id
          in: path
          required: true
          description: Upload session id.
          schema:
            type: string
  /uploads/{id}/pause:
    post:
      operationId: pauseUpload
      summary: Pause an in-progress upload
      description: |-
        Pause an in-progress upload

        _Mock-API source: `pauseUpload`._
      tags:
        - Media & Upload
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadSession'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
      parameters:
        - name: id
          in: path
          required: true
          description: Upload session id.
          schema:
            type: string
  /uploads/{id}/resume:
    post:
      operationId: resumeUpload
      summary: Resume a paused or failed upload
