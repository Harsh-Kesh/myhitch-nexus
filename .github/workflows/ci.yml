name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

# Deployment itself is handled by Railway's GitHub integration, triggered
# separately on push to main — this workflow only verifies the build.
jobs:
  verify:
    name: Typecheck, lint & build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        # npm ci fails intermittently here — see nixpacks.toml for why.
        run: npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npx next lint --max-warnings 0

      - name: Build
        run: npm run build
